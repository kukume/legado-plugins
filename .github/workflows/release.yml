name: Release

on:
  push:
    branches: [master, main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: release-latest
  cancel-in-progress: true

jobs:
  build-and-release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Build IntelliJ plugin
        working-directory: IntelliJ
        env:
          CERTIFICATE_CHAIN: ${{ secrets.CERTIFICATE_CHAIN }}
          PRIVATE_KEY: ${{ secrets.PRIVATE_KEY }}
          PRIVATE_KEY_PASSWORD: ${{ secrets.PRIVATE_KEY_PASSWORD }}
        run: |
          chmod +x ./gradlew
          ./gradlew buildPlugin --no-daemon --stacktrace
          if [ -n "${CERTIFICATE_CHAIN}" ] && [ -n "${PRIVATE_KEY}" ]; then
            ./gradlew signPlugin --no-daemon --stacktrace
            signed=$(find build/distributions -maxdepth 1 -name '*-signed.zip' -print -quit)
            unsigned=$(find build/distributions -maxdepth 1 -name '*.zip' ! -name '*-signed.zip' -print -quit)
            if [ -n "${signed}" ] && [ -n "${unsigned}" ]; then
              cp "${signed}" "${unsigned}"
              rm -f "${signed}"
            fi
          fi

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: vscode/package-lock.json

      - name: Build VS Code VSIX
        working-directory: vscode
        run: |
          npm ci
          npm test
          npm run package

      - name: Publish VS Code extension
        working-directory: vscode
        env:
          VSCE_PAT: ${{ secrets.VSCE_PAT }}
        run: |
          if [ -z "${VSCE_PAT}" ]; then
            echo "VSCE_PAT is not set, skip Marketplace publish"
            exit 0
          fi
          npx --yes @vscode/vsce publish

      - name: Resolve artifacts
        id: artifact
        run: |
          VERSION=$(cd IntelliJ && ./gradlew properties -q | sed -n 's/^version: //p' | head -n1)
          if [ -z "$VERSION" ]; then
            VERSION=$(grep -E '^\s*version\s*=' IntelliJ/build.gradle.kts | head -n1 | sed -E 's/.*"([^"]+)".*/\1/')
          fi
          ZIP_PATH=$(find IntelliJ/build/distributions -maxdepth 1 -name '*.zip' ! -name '*-signed.zip' -print -quit)
          if [ -z "$ZIP_PATH" ]; then
            ZIP_PATH=$(find IntelliJ/build/distributions -maxdepth 1 -name '*.zip' -print -quit)
          fi
          ZIP_NAME=$(basename "$ZIP_PATH")
          VSIX_NAME=$(node -p "require('./vscode/package.json').name + '-' + require('./vscode/package.json').version + '.vsix'")
          VSIX_PATH="vscode/${VSIX_NAME}"
          if [ ! -f "$VSIX_PATH" ]; then
            echo "Missing VSIX: $VSIX_PATH" >&2
            exit 1
          fi
          {
            echo "version=$VERSION"
            echo "zip_path=$ZIP_PATH"
            echo "zip_name=$ZIP_NAME"
            echo "vsix_path=$VSIX_PATH"
            echo "vsix_name=$VSIX_NAME"
          } >> "$GITHUB_OUTPUT"
          echo "Resolved version=$VERSION zip=$ZIP_PATH vsix=$VSIX_PATH"

      - name: Publish latest release (overwrite)
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VERSION: ${{ steps.artifact.outputs.version }}
          ZIP_PATH: ${{ steps.artifact.outputs.zip_path }}
          ZIP_NAME: ${{ steps.artifact.outputs.zip_name }}
          VSIX_PATH: ${{ steps.artifact.outputs.vsix_path }}
          VSIX_NAME: ${{ steps.artifact.outputs.vsix_name }}
          REPO: ${{ github.repository }}
          SHA: ${{ github.sha }}
        run: |
          set -euo pipefail

          SHORT_SHA="${SHA:0:7}"
          TITLE="Legado Kuku ${VERSION}"
          NOTES="$(cat <<EOF
          ## Legado Kuku ${VERSION}

          - Commit: \`${SHORT_SHA}\`
          - IntelliJ: \`${ZIP_NAME}\`
          - VS Code: \`${VSIX_NAME}\`

          ### IntelliJ IDEA
          Settings → Plugins → ⚙️ → Install Plugin from Disk… → 选择 zip

          ### Visual Studio Code / Cursor
          Extensions → ⋯ → Install from VSIX… → 选择 vsix
          EOF
          )"

          gh release delete latest --repo "$REPO" --cleanup-tag --yes || true
          git push origin :refs/tags/latest || true

          gh release create latest "$ZIP_PATH" "$VSIX_PATH" \
            --repo "$REPO" \
            --title "$TITLE" \
            --notes "$NOTES" \
            --latest
